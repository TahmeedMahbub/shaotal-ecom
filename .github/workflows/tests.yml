name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  storefront:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shaotal_storefront_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, dom, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app (no real credentials; the test DB is the local MySQL service)
        run: |
          cp .env.example .env
          php artisan key:generate

      # Same recipe validated locally: SQL source of truth + Google login table + schema drift + test seed.
      - name: Build test database from sql/
        run: |
          for f in sql/ecom.sql sql/google_login.sql tests/Support/ci-schema-drift.sql tests/Support/proposed-schema.sql tests/Support/admin-contract-schema.sql sql/local_test_seed.sql; do
            echo "loading $f"
            mysql -h 127.0.0.1 -u root shaotal_storefront_test < "$f"
          done

      - name: PHP tests (MySQL)
        run: composer test

      - name: JS tests
        run: node --test tests/js/*.test.js

      - name: Code style (changed files only)
        if: github.event_name == 'pull_request'
        run: vendor/bin/pint --test --diff=origin/${{ github.base_ref }}

  # Browser smoke test (tests/browser/smoke.mjs): headless Chrome over CDP, no npm packages. Separate database so rows the
  # smoke test creates (contact messages, carts) never reach the PHPUnit database. Test data only; no secrets.
  browser:
    runs-on: ubuntu-latest
    needs: storefront

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: shaotal_browser_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: shaotal_browser_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: file
      SESSION_DRIVER: file
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8124

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, intl, pdo_mysql, dom, gd, zip, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies (no dev tools needed to serve)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app (no real credentials)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build browser test database
        run: |
          for f in sql/ecom.sql sql/google_login.sql tests/Support/ci-schema-drift.sql tests/Support/proposed-schema.sql tests/Support/admin-contract-schema.sql sql/local_test_seed.sql; do
            mysql -h 127.0.0.1 -u root shaotal_browser_test < "$f"
          done
          php tests/Support/browser-fixtures.php

      - name: Serve the app (PHP built-in server, gzip like production)
        working-directory: public
        run: |
          PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8124 ../tests/Support/perf-router.php > ../storage/logs/browser-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8124/request && break; sleep 1; done

      - name: Browser smoke test
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" BASE=http://127.0.0.1:8124 node tests/browser/smoke.mjs

      # Rendered-page SEO checks (Part 7). On this 5-product seed the pagination checks print SKIP; they run locally on
      # the perf catalog (STOREFRONT_PRODUCTION_READINESS_PLAN.md §19).
      - name: Browser SEO check
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" BASE=http://127.0.0.1:8124 CDP_PORT=9361 node tests/browser/seo.mjs

      # Full COD purchase path (Part 8): register, browse, cart, sign-in redirect, coupon, place (double click → one
      # order), order page, cancel, sourcing photo, newsletter, sign-out. Creates test rows in this database only.
      - name: Browser customer journey
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" BASE=http://127.0.0.1:8124 CDP_PORT=9370 node tests/browser/journey.mjs

      - name: Upload failure artifacts (screenshots + server log; test data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failures
          path: |
            tests/browser/artifacts/
            storage/logs/browser-server.log
          retention-days: 7
